# Icon pack: Material Design Icons (https://pictogrammers.com/library/mdi/).
# License: Apache 2.0. Same icon names as Home Assistant's `mdi:` icons.
#
# `icons` maps every semantic name (icons/semantic.yaml) to an MDI icon name.
# The font is downloaded at build time from `url`; `sha256` guards against the
# file changing upstream.

name: mdi
title: Material Design Icons
version: 7.4.47
license: Apache-2.0
url: https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf
sha256: 61e8aba5a4e981fe22cf7c8e8bcdbea00476e75c62c37f01bf7ee33361d68428

icons:
  # Connection
  wifi: wifi
  wifi_off: wifi-off
  wifi_alert: wifi-alert
  home_assistant: home-assistant
  key_alert: key-alert
  sync: sync
  forbidden: cancel
  disconnected: lan-disconnect

  # System
  home: home
  info: information-outline
  settings: cog
  check: check
  alert: alert
  error: alert-circle
  restart: restart
  update: progress-download
  lock: lock
  lock_open: lock-open-variant
  brightness: brightness-6

  # Devices
  light: lightbulb
  light_off: lightbulb-outline
  power: power
