# English strings: the master language. Every other language defines exactly
# the same keys.

substitutions:
  i18n_lang: en
  # Characters compiled into text fonts.
  i18n_glyphset: GF_Latin_Core

  t_product: "Orbita"

  # Boot screen: "Made by <author icon> <boot_credit>".
  t_made_by: "Made by"

  # Connection screen.
  t_conn_waiting: "Waiting for Home Assistant"
  t_conn_syncing: "Syncing"
  t_conn_syncing_hint: "Getting the latest states"
  # printf format: entities received, entities needed.
  t_conn_syncing_n: "%d of %d entities"
  t_conn_ready: "Connected"
  t_conn_lost: "Connection lost"
  t_conn_lost_hint: "Reconnecting…"
  # printf format: the time the connection was lost (e.g. 14:32).
  t_conn_lost_since: "Retrying since %s"

  # Info card. printf format: the ESPHome version.
  t_info_esphome: "ESPHome %s"

  # Faces: shared state words.
  t_on: "On"
  t_off: "Off"
  t_unavailable: "Unavailable"
  t_loading: "Loading…"
