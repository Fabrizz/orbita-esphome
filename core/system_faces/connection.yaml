# Connection screen: shown by the shell while Home Assistant isn't ready and
# the screen it would show needs it. One page; the icon and texts follow the
# shell's connection stage:
#
#   waiting   the device's name and address, to add it in Home Assistant
#   syncing   how many of the entities the faces need have arrived
#   lost      since when, while the device keeps reconnecting

knob_shell:
  screens:
    connection:
      page: scr_connection
      on_enter:
        - script.execute: connection_render
  on_connection_change:
    - if:
        condition:
          lambda: return stage == knob_shell::Connection::LOST;
        then:
          - lambda: |-
              auto now = id(ha_time).now();
              char buf[8] = "";
              if (now.is_valid())
                now.strftime(buf, sizeof(buf), "%H:%M");
              id(conn_lost_at) = buf;
    - script.execute: connection_render
  on_sync_progress:
    - script.execute: connection_render

globals:
  # Time the connection was lost ("14:32"), empty if the clock wasn't set.
  - id: conn_lost_at
    type: std::string

script:
  - id: connection_render
    then:
      - lvgl.label.update:
          id: conn_icon
          text: !lambda |-
            switch (id(shell).get_connection()) {
              case knob_shell::Connection::SYNCING: return "${ic_sync}";
              case knob_shell::Connection::READY: return "${ic_check}";
              case knob_shell::Connection::LOST: return "${ic_disconnected}";
              default: return "${ic_home_assistant}";
            }
      - lvgl.label.update:
          id: conn_title
          text: !lambda |-
            switch (id(shell).get_connection()) {
              case knob_shell::Connection::SYNCING: return "${t_conn_syncing}";
              case knob_shell::Connection::READY: return "${t_conn_ready}";
              case knob_shell::Connection::LOST: return "${t_conn_lost}";
              default: return "${t_conn_waiting}";
            }
      - lvgl.label.update:
          id: conn_hint
          text: !lambda |-
            char buf[96];
            switch (id(shell).get_connection()) {
              case knob_shell::Connection::SYNCING:
                if (id(shell).sync_total() == 0)
                  return std::string("${t_conn_syncing_hint}");
                snprintf(buf, sizeof(buf), "${t_conn_syncing_n}", (int) id(shell).sync_done(),
                         (int) id(shell).sync_total());
                return std::string(buf);
              case knob_shell::Connection::READY:
                return std::string();
              case knob_shell::Connection::LOST:
                if (id(conn_lost_at).empty())
                  return std::string("${t_conn_lost_hint}");
                snprintf(buf, sizeof(buf), "${t_conn_lost_since}", id(conn_lost_at).c_str());
                return std::string(buf);
              default: {
                // Name and address to add the device by: its IPv4 address, or
                // <name>.local where the device has no address of its own.
                std::string address;
                #ifndef USE_HOST
                // (The PC simulator has no address of its own.)
                for (auto &ip : network::get_ip_addresses()) {
                  if (ip.is_set() && ip.is_ip4()) {
                    char ip_buf[network::IP_ADDRESS_BUFFER_SIZE];
                    address = ip.str_to(ip_buf);
                    break;
                  }
                }
                #endif
                if (address.empty()) {
                  char name_buf[network::USE_ADDRESS_BUFFER_SIZE];
                  address = network::get_use_address_to(name_buf);
                }
                return std::string(App.get_friendly_name().c_str()) + "\n" + address;
              }
            }

lvgl:
  pages:
    - id: scr_connection
      styles: st_bg
      scrollable: false
      widgets:
        - obj:
            align: center
            width: ${safe_w}
            height: SIZE_CONTENT
            bg_opa: transp
            border_width: 0
            pad_all: 0
            scrollable: false
            clickable: false
            layout:
              type: flex
              pad_row: ${sp_m}
              flex_flow: column
              flex_align_main: center
              flex_align_cross: center
              flex_align_track: center
            widgets:
              - label:
                  id: conn_icon
                  text: "${ic_home_assistant}"
                  text_font: f_ic_l
                  styles: st_accent
              - label:
                  id: conn_title
                  text: "${t_conn_waiting}"
                  text_font: f_m
                  styles: st_text
                  width: 100%
                  long_mode: wrap
                  text_align: center
              - label:
                  id: conn_hint
                  text: ""
                  text_font: f_s
                  styles: st_text_dim
                  width: 100%
                  long_mode: wrap
                  text_align: center
