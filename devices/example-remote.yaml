# Example device file for your own ESPHome setup (CLI or Device Builder).
# It doesn't need a copy of this repository: ESPHome downloads the Orbita
# files from GitHub at the version set in `orbita_ref`.
#
# Put it next to your secrets.yaml (see secrets.example.yaml), then:
#   esphome run example-remote.yaml

substitutions:
  device_name: knob-example-remote
  friendly_name: Example knob (remote)
  # Orbita version: a release tag such as v0.1.0 (main is always the latest
  # release). Used for the YAML packages below and for the C++ components.
  orbita_ref: main

packages:
  orbita:
    url: https://github.com/Fabrizz/orbita-esphome
    ref: ${orbita_ref}
    files:
      - boards/host-sdl-r480.yaml
      - i18n/en.yaml
      - themes/dark.yaml
      - icons/mdi.yaml
      - core/all.yaml
      # Faces on the strip, right of HOME: logic (entity, order) + skin (look).
      - path: faces/switch/logic.yaml
        vars: { fid: lamp, entity: switch.living_room_lamp, order: 1 }
      - path: faces/switch/skins/basic.yaml
        vars: { fid: lamp, title: Living room, icon: "${ic_light}" }
