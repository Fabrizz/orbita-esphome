# Copy to devices/secrets.yaml (git-ignored) and fill in.
# ESPHome looks for secrets.yaml next to the device file being built.

wifi_ssid: "MyNetwork"
wifi_password: "change-me"

# Optional fallback access point for first setup
fallback_ap_password: "change-me"

# 32-byte base64 key: generate with
#   python -c "import base64, os; print(base64.b64encode(os.urandom(32)).decode())"
api_encryption_key: "REPLACE_WITH_BASE64_KEY"

ota_password: "change-me"
