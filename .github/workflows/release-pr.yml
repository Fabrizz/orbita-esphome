# Checks for pull requests into main. main only receives releases, so the
# source must be a release/x.y.z or hotfix/x.y.z branch that bumps
# core/version.yaml and has a CHANGELOG.md section for the new version.
name: Release PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source:
    name: Source branch
    runs-on: ubuntu-latest
    steps:
      - name: Only release/* and hotfix/* branches may merge into main
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            release/*|hotfix/*) echo "OK: $HEAD_REF" ;;
            *) echo "::error::Pull requests into main must come from release/<version> or hotfix/<version>, not '$HEAD_REF'. Target develop instead."
               exit 1 ;;
          esac

  version:
    name: Release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # tags, to compare against the latest release
      - name: Version, tag and changelog
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: python3 tools/release.py check --branch "$HEAD_REF"
