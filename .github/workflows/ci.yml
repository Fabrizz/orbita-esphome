name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: ESPHome version pin
        run: python3 tools/check_version_pin.py
      - name: Logo font matches the brand SVGs
        run: |
          python3 -m pip install --quiet "$(grep -i '^fonttools==' requirements.txt)"
          python3 tools/build_logo_font.py --check

  build:
    name: Build
    needs: checks
    uses: ./.github/workflows/build.yml
    with:
      esphome: pinned

  # One stable result for branch rules: green only if every job above passed
  # (build job names change as example devices are added).
  ci-passed:
    name: CI passed
    if: always()
    needs: [checks, build]
    runs-on: ubuntu-latest
    steps:
      - name: All CI jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A CI job did not pass ($result)."
              exit 1
            fi
          done
